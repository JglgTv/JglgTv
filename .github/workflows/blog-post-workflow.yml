name: Latest blog post workflow

on:
  schedule:
    - cron: "0 */12 * * *"  # runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme-with-blog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/jglg"
          max_post_count: 3
          date_format: "mmm d"
          template: "<table width=\"100%\"><tr><td><a href=\"$url\"><img align=\"left\" width=\"40\" height=\"40\" src=\"https://github.com/JglgTv.png\" alt=\"Avatar\"></a> <b>Joaquim Gabriel</b><br/> $date<br/><br/><h2><a href=\"$url\" style=\"text-decoration: none;\">$title</a></h2><a href=\"$url\" style=\"text-decoration: none;\">💬 Add Comment</a></td></tr></table><br/>"
